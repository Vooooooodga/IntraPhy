[project]
name = "intraphy"
version = "0.20.0"
description = "Evidence-qualified exon-copy and splice-feature evolution on species trees"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "biopython>=1.83",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.scripts]
intraphy = "intraphy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/Vooooooodga/IntraPhy"
Repository = "https://github.com/Vooooooodga/IntraPhy"
