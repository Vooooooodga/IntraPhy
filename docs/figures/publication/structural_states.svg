<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="57.32mm" viewBox="0 0 1790 570"><title>Genomic exon-span states and observation constraints</title><desc>Panel A shows example single physical exon-span geometries as separate finite states, including terminal and UTR spans. Panel B shows declared DNA material-tract states 0 (unintroduced), 1 (present), and 2 (deleted), with one origin at the root or on one branch; tip absence is compatible with 0 or 2, while presence requires 1. Panel C shows unknown exon status with compatibility weight one for geometries satisfying recorded DNA constraints. Panel D shows the complete finite state space conditional on observed exon boundaries and declared tract cuts; there is no default state-count cap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="46.00" font-size="43.2" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Genomic exon-span states and observation constraints</text><text x="42.00" y="77.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">One ordered physical exon geometry per state</text><rect x="45" y="120" width="500" height="280" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="68.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Physical exon geometry</text><text x="75.00" y="217.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₁</text><line x1="126.00" y1="211.00" x2="466.00" y2="211.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="139.60" y="197.50" width="91.80" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="292.60" y="197.50" width="78.20" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="391.20" y="197.50" width="61.20" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="75.00" y="282.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₂</text><line x1="126.00" y1="276.00" x2="466.00" y2="276.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="139.60" y="262.50" width="91.80" height="27.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="292.60" y="262.50" width="159.80" height="27.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><text x="68.00" y="338.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Ordered physical intervals</text><text x="68.00" y="375.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">including terminal and UTR spans</text><rect x="582" y="120" width="520" height="280" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="605.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Declared DNA-tract states</text><rect x="606" y="214" width="112" height="48" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="662.00" y="245.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">0</text><rect x="786" y="214" width="112" height="48" rx="8" fill="#F2F5F6" stroke="#356B78" stroke-width="1.5"/><text x="842.00" y="245.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">1</text><rect x="966" y="214" width="112" height="48" rx="8" fill="#F2F5F6" stroke="#72558A" stroke-width="1.5"/><text x="1022.00" y="245.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">2</text><line x1="718" y1="238" x2="786" y2="238" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="898" y1="238" x2="966" y2="238" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="662.00" y="294.00" font-size="28" text-anchor="middle" fill="#637580" font-family="Arial, sans-serif">unintroduced</text><text x="842.00" y="294.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif">present</text><text x="1022.00" y="294.00" font-size="28" text-anchor="middle" fill="#72558A" font-family="Arial, sans-serif">deleted</text><text x="608.00" y="330.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">One origin: root or one branch</text><text x="608.00" y="375.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Absent: 0 or 2; present: 1</text><rect x="1140" y="120" width="602" height="280" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="1163.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Tip compatibility</text><text x="1163.00" y="198.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Unknown exon call; DNA present</text><circle cx="1210" cy="236" r="24" fill="white" stroke="#356B78" stroke-width="2"/><text x="1210.00" y="242.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₁</text><text x="1210.00" y="294.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif">m=1</text><text x="1210.00" y="326.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">w=1</text><circle cx="1360" cy="236" r="24" fill="white" stroke="#356B78" stroke-width="2"/><text x="1360.00" y="242.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₂</text><text x="1360.00" y="294.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif">m=1</text><text x="1360.00" y="326.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">w=1</text><circle cx="1510" cy="236" r="24" fill="white" stroke="#B87923" stroke-width="2"/><text x="1510.00" y="242.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₃</text><text x="1510.00" y="294.00" font-size="28" text-anchor="middle" fill="#B87923" font-family="Arial, sans-serif">m=0/2</text><text x="1510.00" y="326.00" font-size="28" text-anchor="middle" fill="#B87923" font-family="Arial, sans-serif" font-weight="600">w=0</text><text x="1163.00" y="361.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Compatible geometries get weight 1</text><text x="1163.00" y="394.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Known DNA constraints remain active</text><line x1="42" y1="411" x2="1742" y2="411" stroke="#CBD3D7" stroke-width="1" stroke-dasharray=""/><text x="48.00" y="453.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">D   Finite geometry catalogue</text><text x="48.00" y="482.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Observed boundaries + tract cuts</text><line x1="545" y1="465" x2="640" y2="465" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="670.00" y="453.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Finite catalogue</text><text x="670.00" y="482.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Complete enumeration</text><circle cx="1015" cy="450" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1015.00" y="456.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₁</text><circle cx="1155" cy="450" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1155.00" y="456.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₂</text><circle cx="1085" cy="520" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1085.00" y="526.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">G₃</text><circle cx="1235" cy="520" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1235.00" y="526.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">…</text><line x1="1035" y1="450" x2="1135" y2="450" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="1168" y1="466" x2="1100" y2="504" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="1105" y1="520" x2="1215" y2="520" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="1320.00" y="468.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">No default count cap</text><text x="1320.00" y="506.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Limits stop; no truncation</text></g></svg>
