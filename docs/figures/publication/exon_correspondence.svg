<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="59.66mm" viewBox="0 0 1780 590"><title>Genomic correspondence and exon-span observations</title><desc>Panel A emphasizes whole-locus genomic DNA alignment and shared coordinates. Panel B schematically shows collinear interval matches in local genomic order without specifying a path-selection algorithm. Panel C distinguishes a qualified physical exon-span observation, DNA absence supported by paired flanks, and unknown or conflicting evidence. Correspondence and observations remain conditional on sequence support and annotation coverage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="46.00" font-size="43.2" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Genomic correspondence and exon-span observations</text><text x="42.00" y="76.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Shared coordinates depend on qualified whole-locus sequence evidence</text><text x="55.00" y="131.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Genomic alignment</text><text x="55.00" y="160.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">annotated physical exon intervals</text><text x="55.00" y="190.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Species 1</text><line x1="62.00" y1="217.00" x2="562.00" y2="217.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="82.00" y="205.00" width="100.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="217.00" y="205.00" width="70.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="407.00" y="205.00" width="55.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="497.00" y="205.00" width="55.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="55.00" y="393.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Species 2</text><line x1="62.00" y1="355.00" x2="562.00" y2="355.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="82.00" y="346.00" width="100.00" height="18.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="217.00" y="346.00" width="70.00" height="18.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="407.00" y="346.00" width="55.00" height="18.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="497.00" y="346.00" width="55.00" height="18.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><line x1="182" y1="241" x2="182" y2="355" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="302" y1="241" x2="302" y2="355" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="412" y1="241" x2="412" y2="355" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="507" y1="241" x2="507" y2="355" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><text x="61.00" y="431.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Shared alignment coordinates</text><line x1="580" y1="280" x2="632" y2="280" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="650.00" y="131.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Interval correspondence</text><text x="650.00" y="159.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">collinear matches, ordered locally</text><rect x="660" y="232" width="132" height="46" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="726.00" y="263.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Match 1</text><rect x="812" y="232" width="132" height="46" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="878.00" y="263.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Match 2</text><rect x="964" y="232" width="132" height="46" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="1030.00" y="263.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Match 3</text><line x1="792" y1="255" x2="812" y2="255" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="944" y1="255" x2="964" y2="255" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="660.00" y="324.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Order + strand + shared sequence</text><text x="660.00" y="374.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Sequence-qualified local chain</text><line x1="1138" y1="280" x2="1180" y2="280" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="1190.00" y="131.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Tip observations</text><rect x="1190" y="171" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="227.00" font-size="36.800000000000004" text-anchor="start" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">E</text><text x="1250.00" y="210.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Qualified exon-span observation</text><text x="1250.00" y="246.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">physical interval on genomic DNA</text><rect x="1190" y="268" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="324.00" font-size="36.800000000000004" text-anchor="start" fill="#B87923" font-family="Arial, sans-serif" font-weight="600">∅</text><text x="1250.00" y="307.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">DNA absence</text><text x="1250.00" y="343.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">paired flanks support the call</text><rect x="1190" y="365" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="421.00" font-size="36.800000000000004" text-anchor="start" fill="#A34F4F" font-family="Arial, sans-serif" font-weight="600">?</text><text x="1250.00" y="404.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Unknown or conflicting</text><text x="1250.00" y="440.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">mapping / annotation unresolved</text><line x1="42" y1="473" x2="1732" y2="473" stroke="#CBD3D7" stroke-width="1" stroke-dasharray=""/><text x="48.00" y="514.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Physical intervals define genomic exon-span geometry.</text><text x="48.00" y="544.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Unknown status retains any known DNA constraints.</text></g></svg>
