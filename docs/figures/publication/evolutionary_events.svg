<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="99.05mm" viewBox="0 0 1790 985"><title>Elementary model edits</title><desc>Panels A–F illustrate allowed model transitions including split and fusion on retained DNA, exon-boundary movement, exonization, annotation-conditional exon inactivation, and source-supported DNA insertion. Panel G shows one before/after genomic exon geometry in which a single DNA deletion changes multiple exon spans; it does not show coexisting transcript configurations. The motifs are conditional on the declared catalogue and annotation support. Branch endpoint labels do not identify a transition path, event count, or molecular mechanism.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="46.00" font-size="43.2" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Elementary model edits</text><text x="42.00" y="80.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Allowed transitions in the declared genomic exon-span edit graph</text><rect x="42" y="105" width="530" height="242" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="62.00" y="140.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Split</text><text x="60.00" y="210.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Before</text><text x="60.00" y="273.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">After</text><line x1="147.00" y1="204.00" x2="537.00" y2="204.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="178.20" y="193.50" width="327.60" height="21.00" fill="#356B78" stroke="#294353" stroke-dasharray=