troke-width="1.5" stroke-dasharray=""/><rect x="308.60" y="286.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="286.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="286.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><line x1="252.7" y1="355" x2="300" y2="355" stroke="#CBD3D7" stroke-width="1.5" stroke-dasharray=""/><line x1="300.00" y1="355.00" x2="515.00" y2="355.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="308.60" y="346.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="346.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="346.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><line x1="252.7" y1="415" x2="300" y2="415" stroke="#CBD3D7" stroke-width="1.5" stroke-dasharray=""/><line x1="300.00" y1="415.00" x2="515.00" y2="415.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="308.60" y="406.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="406.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="406.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="66.00" y="510.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Physical exon-span compatibility</text><text x="66.00" y="548.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Root, topology and branch lengths</text><text x="66.00" y="582.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">are supplied model conditions</text><rect x="590" y="120" width="1158" height="525" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="614.00" y="163.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Conditional pruning and family likelihood</text><line x1="655" y1="281" x2="655" y2="401" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="655" y1="281" x2="736.2" y2="281" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="655" y1="401" x2="736.2" y2="401" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="251" x2="736.2" y2="311" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="371" x2="736.2" y2="431" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="251" x2="823.2" y2="251" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="311" x2="823.2" y2="311" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="371" x2="823.2" y2="371" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="431" x2="823.2" y2="431" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><text x="831.20" y="257.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">A</text><text x="831.20" y="317.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">B</text><text x="831.20" y="377.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">C</text><text x="831.20" y="437.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">D</text><line x1="818.2" y1="245" x2="744.2" y2="245" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="319" x2="744.2" y2="319" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="364" x2="744.2" y2="364" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="439" x2="744.2" y2="439" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="732.2" y1="272" x2="663" y2="272" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="732.2" y1="410" x2="663" y2="410" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="932.00" y="222.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Prune within one origin scenario s</text><text x="932" y="267" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">L</tspan><tspan font-size="19.6" dy="8.4">u</tspan><tspan font-size="28.0" dy="-8.4">(s)</tspan><tspan font-size="28.0" dy="0.0"> = Σ</tspan><tspan font-size="19.6" dy="8.4">i</tspan><tspan font-size="28.0" dy="-8.4"> π</tspan><tspan font-size="19.6" dy="8.4">i</tspan><tspan font-size="28.0" dy="-8.4">(s)</tspan><tspan font-size="28.0" dy="0.0"> L</tspan><tspan font-size="19.6" dy="8.4">root</tspan><tspan font-size="28.0" dy="-8.4">(i | s)</tspan></text><text x="932.00" y="315.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Scenario likelihoods are weighted by their prior</text><text x="932" y="359" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">L</tspan><tspan font-size="19.6" dy="8.4">u</tspan><tspan font-size="28.0" dy="-8.4"> = Σ</tspan><tspan font-size="19.6" dy="8.4">s</tspan><tspan font-size="28.0" dy="-8.4"> p(s) L</tspan><tspan font-size="19.6" dy="8.4">u</tspan><tspan font-size="28.0" dy="-8.4">(s)</tspan></text><text x="932.00" y="407.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Family composite log likelihood</text><text x="932" y="450" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">ℓ</tspan><tspan font-size="19.6" dy="8.4">family</tspan><tspan font-size="28.0" dy="-8.4"> = Σ</tspan><tspan font-size="19.6" dy="8.4">u</tspan><tspan font-size="28.0" dy="-8.4"> log L</tspan><tspan font-size="19.6" dy="8.4">u</tspan></text><text x="932" y="504" font-size="28" fill="#72558A" font-family="Arial, sans-serif"><tspan font-size="28.0" dy="0.0">P</tspan><tspan font-size="19.6" dy="8.4">s,b</tspan><tspan font-size="28.0" dy="-8.4">(t) = exp(Q</tspan><tspan font-size="19.6" dy="8.4">s,b</tspan><tspan font-size="28.0" dy="-8.4">t)</tspan></text><text x="932.00" y="544.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Node marginals integrate origin scenarios</text><rect x="42" y="690" width="530" height="260" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="66.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Branch endpoint summaries</text><text x="72.00" y="784.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Parent</text><text x="385.00" y="784.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Child</text><line x1="72.00" y1="810.00" x2="257.00" y2="810.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="81.25" y="800.00" width="61.05" height="20.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="173.75" y="800.00" width="55.50" height="20.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><line x1="265" y1="822" x2="340" y2="822" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="265" y1="839" x2="340" y2="839" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="353.00" y1="810.00" x2="538.00" y2="810.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="362.25" y="800.00" width="61.05" height="20.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="454.75" y="800.00" width="24.05" height="20.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="495.45" y="800.00" width="14.80" height="20.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="66.00" y="884.00" font-size="28" text-anchor="start" fill="#72558A" font-family="Arial, sans-serif" font-weight="600">Branch P: geometry differs</text><text x="66.00" y="920.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Joint modal endpoint pair</text><rect x="630" y="690" width="530" height="260" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="654.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">D   Per-family rate fit</text><text x="654.00" y="786.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">One nonnegative μ per family</text><text x="654.00" y="824.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Shared across edit kinds</text><text x="654.00" y="860.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">and linked local units</text><text x="654.00" y="903.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Linked units: composite likelihood</text><rect x="1218" y="690" width="530" height="260" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1242.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">E   Declared conditions</text><text x="1242.00" y="786.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Supplied tree + branch lengths</text><text x="1242.00" y="824.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Finite exon-boundary catalogue</text><text x="1242.00" y="860.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Root and origin assumptions</text><text x="1242.00" y="903.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Inference conditional on</text><text x="1242.00" y="933.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">these declared choices</text><text x="48" y="990" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">q</tspan><tspan font-size="19.6" dy="8.4">ij</tspan><tspan font-size="28.0" dy="-8.4"> = μ Σ</tspan><tspan font-size="19.6" dy="8.4">e:i→j</tspan><tspan font-size="28.0" dy="-8.4"> w</tspan><tspan font-size="19.6" dy="8.4">e</tspan><tspan font-size="28.0" dy="-8.4">   (i ≠ j)</tspan></text><text x="48" y="1027" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">q</tspan><tspan font-size="19.6" dy="8.4">ii</tspan><tspan font-size="28.0" dy="-8.4"> = −Σ</tspan><tspan font-size="19.6" dy="8.4">j≠i</tspan><tspan font-size="28.0" dy="-8.4"> q</tspan><tspan font-size="19.6" dy="8.4">ij</tspan></text><text x="48.00" y="1063.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">μ is shared across the edit graph; weights divide opportunities.</text><text x="48.00" y="1098.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Equal-rate graph baseline ≠ biological rate equality; endpoints do not specify paths.</text></g></svg>
