<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="113.13mm" viewBox="0 0 1790 1125"><title>Default genomic exon-span CTMC on a supplied tree</title><desc>Panel A shows physical exon-span tip observations on a supplied rooted tree. Panel B shows pruning conditional on one declared material-origin scenario s, using the scenario-specific root prior π_i(s) and branch/origin-specific generator Q_s,b. Scenario likelihoods are weighted by their prior; linked-unit likelihoods contribute to the family composite log likelihood. Panel C shows branch endpoint geometry-change probability and joint modal parent/child configurations, not transition counts. Panel D shows one nonnegative rate per family shared across edit kinds and linked units. Panel E lists supplied tree and branch lengths, finite boundary catalogue, and root/origin assumptions. For eligible edit edges, q_ij = μ Σ_e w_e and q_ii = −Σ_j≠i q_ij. Equal rates define a graph baseline, not equal biological rates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="50.00" font-size="44.800000000000004" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Default genomic exon-span CTMC on a supplied tree</text><text x="42.00" y="87.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">One physical exon-span geometry with declared DNA-material states</text><rect x="42" y="120" width="515" height="525" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="66.00" y="163.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Tree and tip evidence</text><line x1="86" y1="265" x2="86" y2="385" stroke="#20313D" stroke-width="2" stroke-dashar